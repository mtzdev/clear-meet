appId: com.mtzdev.clearmeet
productName: ClearMeet
copyright: Copyright © 2026 Matheus Oliveira

directories:
  buildResources: build
  output: release

files:
  - out/**
  - package.json

asar: true
asarUnpack:
  - node_modules/@koromix/koffi-*/**

extraResources:
  - from: LICENSE
    to: LICENSE.txt

electronLanguages:
  - pt-BR
  - en-US

npmRebuild: false

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: x64
  artifactName: ${productName}-Setup-${version}.${ext}

nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: ClearMeet
  runAfterFinish: true
  deleteAppDataOnUninstall: false

publish:
  provider: github
  owner: mtzdev
  repo: clear-meet
  releaseType: draft
